services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET}
      - ZOHO_REFRESH_TOKEN=${ZOHO_REFRESH_TOKEN}
      - ZOHO_ACCOUNTS_BASE_URL=${ZOHO_ACCOUNTS_BASE_URL}
      - ZOHO_API_BASE_URL=${ZOHO_API_BASE_URL}
      - ZOHO_SMTP_HOST=${ZOHO_SMTP_HOST}
      - ZOHO_SMTP_PORT=${ZOHO_SMTP_PORT}
      - ZOHO_SMTP_USER=${ZOHO_SMTP_USER}
      - ZOHO_SMTP_PASS=${ZOHO_SMTP_PASS}
      - ZOHO_SMTP_FROM_NAME=${ZOHO_SMTP_FROM_NAME}
      - ZOHO_SMTP_FROM_EMAIL=${ZOHO_SMTP_FROM_EMAIL}
      - ZOHO_SMTP_SECURE=${ZOHO_SMTP_SECURE}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL}
      - MAILGUN_FROM_NAME=${MAILGUN_FROM_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
